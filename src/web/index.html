<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#7c3aed" />
    <meta name="description" content="NerdQuiz - Gamified IT exam prep for ITPEC FE certification" />
    <title>NerdQuiz - IT Exam Prep</title>
    <script>
      (function () {
        var theme = 'system';
        try {
          theme = localStorage.getItem('nerdquiz-theme') || 'system';
        } catch (_) {
          // Storage can be unavailable in privacy-restricted browsing contexts.
        }
        var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (theme === 'dark' || (theme === 'system' && prefersDark)) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
    <style>
      .app-loading { background: #f9fafb; color: #7c3aed; }
      .app-loading__spinner { border-color: #ddd6fe; border-top-color: #7c3aed; }
      .dark .app-loading { background: #0f0a1e; color: #a78bfa; }
      .dark .app-loading__spinner { border-color: #312e81; border-top-color: #7c3aed; }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="app-loading">
        <div class="app-loading__content">
          <div class="app-loading__spinner"></div>
          <p>Loading NerdQuiz...</p>
        </div>
      </div>
    </div>
    <noscript>
      <div class="no-script">
        <div>
          <h1 class="no-script__title">JavaScript Required</h1>
          <p class="no-script__message">NerdQuiz requires JavaScript to run. Please enable JavaScript in your browser settings and reload the page.</p>
        </div>
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
